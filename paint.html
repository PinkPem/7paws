<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>7paws 画毛色</title>
  </head>
  <body>
    <div id="stage" role="application" aria-label="画笔绘制区"></div>

    <aside id="bar">
      <div class="row">
        <span class="label">颜色</span>
        <div id="swatches"></div>
      </div>
      <div class="row">
        <span class="label">自定义</span>
        <input id="color" type="color" value="#f7f3ea" />
      </div>
      <div class="row">
        <span class="label">笔刷</span>
        <input id="size" type="range" min="2" max="48" step="1" value="10" />
        <output id="sizeOut">10</output>
      </div>
      <div class="row">
        <label class="check"><input id="mirror" type="checkbox" checked /> 对称绘制</label>
      </div>
      <div class="row">
        <span class="label">视角（左右）</span>
        <input id="yaw" type="range" min="-180" max="180" step="1" value="0" />
        <output id="yawOut">0°</output>
      </div>
      <div class="row">
        <span class="label">视角（上下）</span>
        <input id="pitch" type="range" min="-35" max="35" step="1" value="0" />
        <output id="pitchOut">0°</output>
      </div>
      <div class="row">
        <label class="check" title="头部暂时隐藏，便于给脖子和胸口上缘上色"><input id="hideHead" type="checkbox" /> 隐藏头部（画脖子）</label>
      </div>
      <div class="row">
        <label class="check" title="身体暂时隐藏，配合上下视角可以给头部下侧上色"><input id="hideBody" type="checkbox" /> 隐藏身体（画头下侧）</label>
      </div>
      <div class="row">
        <button id="resetView" type="button">重置视角</button>
      </div>
      <div class="row">
        <button id="undo" type="button">撤销</button>
        <button id="clear" type="button">清空</button>
      </div>
      <div class="row">
        <button id="copy" type="button">复制笔迹</button>
        <button id="done" type="button" class="primary">完成</button>
      </div>
      <p id="hint">在猫身上按住拖动即可涂色；<b>对称绘制</b> 会把笔迹镜像到另一半。转视角或隐藏头部可以画到背面与脖子。</p>
    </aside>

    <script src="/vendor/three.min.js"></script>
    <script src="/vendor/7paws.js"></script>
    <script type="module" src="/src/paint.ts"></script>
  </body>
</html>
